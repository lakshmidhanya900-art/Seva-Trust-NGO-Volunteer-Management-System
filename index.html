<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seva Trust – NGO Volunteer Management System</title>
<style>
:root{--bg:#f7fbf8;--card:#fff;--tx:#17312200;--tx:#173122;--mut:#5d7366;--g:#2e9e5b;--gd:#1f7a43;--o:#f6a35b;--ol:#fff1e3;--bd:#dfeae3;--sh:0 6px 24px rgba(30,90,55,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#16251c;--tx:#e8f3ec;--mut:#9bb3a4;--ol:#2b2118;--bd:#254033;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#16251c;--tx:#e8f3ec;--mut:#9bb3a4;--ol:#2b2118;--bd:#254033;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}h1,h2,h3{margin:0 0 .4em;line-height:1.2}
.w{max-width:1150px;margin:auto;padding:0 18px}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);box-shadow:var(--sh)}
nav .in{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1150px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--gd)}.brand svg{width:38px;height:38px}.brand small{display:block;font-weight:500;color:var(--mut);font-size:.7rem}
.links{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.links a{padding:8px 12px;border-radius:8px;font-size:.92rem;transition:.2s}.links a:hover,.links a.on{background:var(--ol);color:var(--gd)}
.burger{display:none;margin-left:auto}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--g);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:.92rem;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(46,158,91,.35);background:var(--gd)}
.btn.o{background:var(--o);color:#3b2307}.btn.o:hover{background:#f19240}.btn.ghost{background:transparent;color:var(--gd);border:1.5px solid var(--g)}.btn.ghost:hover{background:var(--ol)}.btn.sm{padding:6px 11px;font-size:.8rem}.btn.r{background:#d9534f}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#e9f7ee,#fff1e3);padding:70px 0 80px;text-align:center}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#143023,#2b2118)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#143023,#2b2118)}}
.blob{position:absolute;border-radius:50%;filter:blur(6px);opacity:.45;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translate(30px,-40px) scale(1.1)}}
.hero .w{position:relative}.hero h1{font-size:clamp(1.8rem,5vw,3.2rem);color:var(--gd)}.hero h2{color:#d9822b;letter-spacing:.2em}.hero p{color:var(--mut);font-size:1.15rem;font-style:italic}
.hero .logo{width:92px;height:92px;animation:pop 1s}@keyframes pop{from{transform:scale(0) rotate(-90deg)}}
section{padding:46px 0}section>.w>h2{text-align:center;font-size:1.8rem}.sub{text-align:center;color:var(--mut);margin-bottom:26px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);overflow:hidden;transition:transform .3s}
.card.pad{padding:18px}.card:hover{transform:translateY(-4px)}
.pc .img{overflow:hidden;height:170px}.pc .img svg{width:100%;height:100%;display:block;transition:transform .6s}.pc:hover .img svg{transform:scale(1.12)}
.pc .b{padding:14px 16px 16px}.pc h3{font-size:1.05rem}.pc p{color:var(--mut);font-size:.88rem;margin:.3em 0}.meta{font-size:.8rem;color:var(--mut);display:grid;gap:2px;margin:8px 0}
.act{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-block;background:var(--ol);color:#b8651a;font-size:.72rem;padding:2px 9px;border-radius:99px;font-weight:700}
.badge{padding:3px 10px;border-radius:99px;font-size:.75rem;font-weight:700}.approved{background:#d6f3e0;color:#1a7a43}.pending{background:#ffe9cc;color:#a45c0a}.rejected{background:#fde0df;color:#b3312c}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.stat{padding:20px;text-align:center}.stat b{display:block;font-size:2.1rem;color:var(--g)}.stat span{color:var(--mut);font-size:.85rem}
.fi{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.fi.in{opacity:1;transform:none}
.page{animation:pg .45s}@keyframes pg{from{opacity:0;transform:translateX(14px)}}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}
.side{background:var(--card);border-right:1px solid var(--bd);padding:14px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto}
.side a{display:block;padding:10px 12px;border-radius:10px;margin-bottom:3px;font-size:.92rem;transition:.2s}.side a:hover,.side a.on{background:var(--ol);color:var(--gd);font-weight:700}
.side h4{margin:4px 8px 12px;color:var(--o)}.main{padding:22px;min-width:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-size:.78rem;text-transform:uppercase}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--g)}
label{font-size:.82rem;font-weight:600;color:var(--mut)}.err{color:#d9534f;font-size:.82rem;min-height:1.1em}
.auth{max-width:430px;margin:40px auto}.auth h2{text-align:center}
.bar{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--g),var(--o));transition:width 1s}.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.82rem}.row span:first-child{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut{width:150px;height:150px;border-radius:50%;margin:auto;position:relative}.donut:after{content:"";position:absolute;inset:28px;background:var(--card);border-radius:50%}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:pg .25s}.md{background:var(--card);border-radius:16px;padding:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--gd);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;animation:pg .3s;box-shadow:var(--sh)}
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.search input,.search select{flex:1;min-width:160px;margin:0}
footer{background:#143d27;color:#d6eadd;padding:34px 0 20px;margin-top:30px}footer .grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}footer h4{color:var(--o)}.soc a{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;background:#1f7a43;margin-right:6px;transition:.2s}.soc a:hover{background:var(--o);transform:scale(1.15)}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.gal div{border-radius:12px;overflow:hidden;height:110px}.gal svg{width:100%;height:100%;transition:transform .5s}.gal div:hover svg{transform:scale(1.2)}
.two{display:grid;gap:18px;grid-template-columns:1fr 1fr}
.stars{color:var(--o);letter-spacing:2px;white-space:nowrap}.wrap{display:inline-block;white-space:normal;min-width:220px;max-width:380px}
@media(max-width:820px){.burger{display:block}.links{display:none;width:100%;margin:0}.links.open{display:flex}nav .in{flex-wrap:wrap}.shell{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}.side a,.side h4{white-space:nowrap}.side h4{display:none}.two{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#certbox,#certbox *{visibility:visible}#certbox{position:fixed;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="nav"></div><div id="app"></div><div id="modal"></div>
<script>
const K='seva2',$=q=>document.querySelector(q),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO=`<svg viewBox="0 0 48 48" class="logo"><circle cx="24" cy="24" r="22" fill="#2e9e5b"/><path d="M24 36C14 28 12 20 18 16c3-2 6 0 6 3 0-3 3-5 6-3 6 4 4 12-6 20z" fill="#fff"/><path d="M9 37q15 9 30 0" stroke="#f6a35b" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const PR=[['Education for Every Child','Education','Chennai – Tondiarpet','2026-11-15',25,'Free classes, books and mentoring for children from low-income families.','#4aa3df','#a8e0ff','📚','🧒'],
['Food Distribution Drive','Hunger Relief','Mumbai – Dharavi','2026-11-18',40,'Cooking and distributing nutritious meals to families and homeless people.','#f6a35b','#ffd9a8','🍲','🤲'],
['Tree Plantation Campaign','Environment','Bengaluru – Bannerghatta','2026-11-22',60,'Planting 5,000 saplings to restore green cover and fight climate change.','#2e9e5b','#a8ecc2','🌳','🌱'],
['Blood Donation Camp','Health','Hyderabad – Secunderabad','2026-11-25',30,'Awareness drive and donation camp with certified medical partners.','#e05a5a','#ffc2c2','🩸','❤️'],
['Women Empowerment Program','Empowerment','Jaipur – Malviya Nagar','2026-12-01',20,'Tailoring, digital literacy and entrepreneurship training for women.','#b06ad6','#e6c8f7','👩‍💼','🧵'],
['Health Awareness Camp','Health','Kolkata – Salt Lake','2026-12-05',35,'Free medical checkups, screenings and hygiene awareness sessions.','#22a7a0','#a6ece7','🩺','💊'],
['Clean India Campaign','Environment','Delhi – Yamuna Ghat','2026-12-10',80,'Community clean-up of public places, with waste segregation awareness.','#6fae3b','#d4f1a6','🧹','♻️'],
['Animal Welfare Program','Animal Care','Pune – Kothrud','2026-12-14',15,'Feeding, vaccination and shelter support for stray animals.','#c98a4b','#f1d3ae','🐕','🐾'],
['Rural Development Initiative','Community','Madurai – Melur','2026-12-18',45,'Clean water, sanitation and school upgrades in remote villages.','#8a9a2e','#e3ecb0','🏡','🚜'],
['Disaster Relief Support','Relief','Kochi – Aluva','2026-12-22',50,'Packing and delivering relief kits, tents and medicines to affected families.','#3c6fb5','#b9d1f5','📦','⛑️']];
function seed(){const d={programs:PR.map((p,i)=>({id:'p'+(i+1),t:p[0],cat:p[1],loc:p[2],date:p[3],need:p[4],desc:p[5],c1:p[6],c2:p[7],ic:p[8],ic2:p[9]})),
users:[['u1','Priya Sharma','priya@mail.com','Chennai','9876543210','Teaching, Event Management'],['u2','Arjun Mehta','arjun@mail.com','Mumbai','9812345678','Cooking, Logistics'],['u3','Kavya Nair','kavya@mail.com','Kochi','9898989898','First Aid, Photography']].map(u=>({id:u[0],name:u[1],email:u[2],pass:'vol123',city:u[3],phone:u[4],skills:u[5],joined:'2026-08-1'+u[0][1]})),
apps:[['a1','u1','p1','approved',16],['a2','u1','p3','pending',0],['a3','u2','p2','approved',12],['a4','u3','p5','pending',0],['a5','u2','p4','rejected',0],['a6','u3','p7','approved',10]].map(a=>({id:a[0],uid:a[1],pid:a[2],st:a[3],hrs:a[4],date:'2026-10-2'+a[0][1]})),
certs:[{id:'ST-2026-1001',uid:'u1',pid:'p1',date:'2026-10-30'}],
notes:[{id:'n1',to:'all',msg:'Welcome to Seva Trust! Browse programs and apply today.',date:'2026-10-01'},{id:'n2',to:'u1',msg:'Your application for Education for Every Child was approved.',date:'2026-10-24'},{id:'n3',to:'admin',msg:'3 new applications are awaiting review.',date:'2026-11-01'}],
donations:[['Ramesh Iyer',5000,'Education for Every Child'],['Sunita Rao',2500,'Food Distribution Drive'],['Tech Mahindra CSR',50000,'Tree Plantation Campaign'],['Anil Gupta',1000,'Animal Welfare Program'],['Meena Kapoor',7500,'Disaster Relief Support']].map((x,i)=>({id:'d'+i,donor:x[0],amt:x[1],prog:x[2],date:'2026-10-0'+(i+1)})),
events:[{id:'e1',t:'Volunteer Orientation Day',date:'2026-11-08',loc:'Seva Trust HQ, Chennai'},{id:'e2',t:'Annual Charity Walk',date:'2026-11-29',loc:'Marina Beach, Chennai'},{id:'e3',t:'Skill Training Workshop',date:'2026-12-06',loc:'Online (Zoom)'}],
reviews:[{id:'r1',uid:'u1',pid:'p1',rating:5,msg:'Wonderful experience teaching the kids. Well organised and very rewarding!',date:'2026-11-01'},{id:'r2',uid:'u2',pid:'p2',rating:4,msg:'Great drive, but we needed a few more helpers for packing.',date:'2026-11-02'},{id:'r3',uid:'u3',pid:'p7',rating:5,msg:'Clean-up was well planned and the team was very supportive.',date:'2026-11-03'}]};return d}
let db,S=null;try{db=JSON.parse(localStorage.getItem(K))}catch(x){}try{S=JSON.parse(localStorage.getItem(K+'s'))}catch(x){}
if(!db)db=seed();if(!db.reviews)db.reviews=[];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(K+'s',JSON.stringify(S))}catch(x){}};
const U=id=>db.users.find(u=>u.id==id),Pg=id=>db.programs.find(p=>p.id==id),uid=()=>Math.random().toString(36).slice(2,8),today=()=>new Date().toISOString().slice(0,10);
const art=p=>`<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.c2}"/><stop offset="1" stop-color="${p.c1}"/></linearGradient></defs><rect width="400" height="240" fill="url(#g${p.id})"/><circle cx="320" cy="50" r="38" fill="#fff" opacity=".5"/><circle cx="60" cy="190" r="70" fill="#fff" opacity=".18"/><path d="M0 190Q100 150 200 185T400 170V240H0z" fill="${p.c1}" opacity=".7"/><path d="M0 215Q120 185 230 212T400 205V240H0z" fill="#fff" opacity=".35"/><text x="200" y="145" font-size="92" text-anchor="middle">${p.ic}</text><text x="95" y="190" font-size="38" text-anchor="middle">${p.ic2}</text><text x="315" y="195" font-size="34" text-anchor="middle">🤝</text></svg>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3000)}
const close=()=>{$('#modal').innerHTML=''};
function ask(m){return new Promise(r=>{$('#modal').innerHTML=`<div class="ov"><div class="md" style="max-width:380px"><h3>Please confirm</h3><p>${e(m)}</p><div class="act"><button class="btn" id="y">Yes, continue</button><button class="btn ghost" id="n">Cancel</button></div></div></div>`;$('#y').onclick=()=>{close();r(true)};$('#n').onclick=()=>{close();r(false)}})}
function form(title,f,cb){$('#modal').innerHTML=`<div class="ov"><form class="md" style="max-width:460px" id="mf"><h3>${title}</h3>${f.map(x=>`<label>${x[1]}</label>${x[3]=='area'?`<textarea name="${x[0]}" rows="3">${e(x[2])}</textarea>`:x[3]=='sel'?`<select name="${x[0]}">${x[4].map(o=>`<option value="${e(o[0])}" ${o[0]==x[2]?'selected':''}>${e(o[1])}</option>`).join('')}</select>`:`<input name="${x[0]}" type="${x[3]||'text'}" value="${e(x[2])}" required>`}`).join('')}<div class="act"><button class="btn">Save</button><button type="button" class="btn ghost" onclick="closeM()">Cancel</button></div></form></div>`;$('#mf').onsubmit=ev=>{ev.preventDefault();cb(Object.fromEntries(new FormData(ev.target)));close()}}
const stars=n=>`<span class="stars" title="${n}/5">${'★'.repeat(n)+'☆'.repeat(5-n)}</span>`;
const badge=s=>`<span class="badge ${s}">${s[0].toUpperCase()+s.slice(1)}</span>`;
const fd=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
function tbl(h,rows){return `<div class="card tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Nothing here yet.</td></tr>`}</table></div>`}
function pcard(p,i=0){return `<div class="card pc fi" style="transition-delay:${(i%3)*90}ms"><div class="img">${art(p)}</div><div class="b"><span class="tag">${p.cat}</span><h3>${e(p.t)}</h3><p>${e(p.desc)}</p><div class="meta"><span>📍 ${e(p.loc)}</span><span>📅 ${fd(p.date)}</span><span>👥 ${p.need} volunteers required</span></div><div class="act"><button class="btn sm" onclick="A.apply('${p.id}')">Apply Now</button><a class="btn sm ghost" href="#program-${p.id.slice(1)}">Learn More</a></div></div></div>`}
function certSVG(c){const u=U(c.uid)||{name:'Volunteer'},p=Pg(c.pid)||{t:'Program'};return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" font-family="Georgia,serif"><rect width="800" height="560" fill="#fffdf7"/><rect x="14" y="14" width="772" height="532" fill="none" stroke="#2e9e5b" stroke-width="8"/><rect x="30" y="30" width="740" height="500" fill="none" stroke="#f6a35b" stroke-width="2"/><g transform="translate(350 48) scale(2)"><circle cx="24" cy="24" r="22" fill="#2e9e5b"/><path d="M24 36C14 28 12 20 18 16c3-2 6 0 6 3 0-3 3-5 6-3 6 4 4 12-6 20z" fill="#fff"/><path d="M9 37q15 9 30 0" stroke="#f6a35b" stroke-width="3" fill="none"/></g><text x="400" y="175" text-anchor="middle" font-size="22" fill="#1f7a43" font-weight="bold" letter-spacing="4">SEVA TRUST</text><text x="400" y="228" text-anchor="middle" font-size="40" fill="#17312" font-weight="bold" style="fill:#173122">CERTIFICATE OF APPRECIATION</text><text x="400" y="272" text-anchor="middle" font-size="16" fill="#5d7366">This certificate is proudly presented to</text><text x="400" y="330" text-anchor="middle" font-size="44" fill="#d9822b" font-style="italic">${e(u.name)}</text><line x1="220" y1="342" x2="580" y2="342" stroke="#f6a35b"/><text x="400" y="378" text-anchor="middle" font-size="16" fill="#173122">for outstanding voluntary service in the program</text><text x="400" y="410" text-anchor="middle" font-size="24" fill="#1f7a43" font-weight="bold">${e(p.t)}</text><text x="400" y="440" text-anchor="middle" font-size="15" fill="#5d7366">Date of participation: ${fd(p.date)}</text><text x="90" y="500" font-size="13" fill="#5d7366">Certificate ID: ${c.id}</text><text x="650" y="480" text-anchor="middle" font-size="26" fill="#173122" font-style="italic">S. Ramanathan</text><line x1="540" y1="488" x2="760" y2="488" stroke="#173122"/><text x="650" y="506" text-anchor="middle" font-size="12" fill="#5d7366">Authorized Signature – Seva Trust</text><text x="90" y="520" font-size="11" fill="#5d7366">Issued: ${fd(c.date)}</text></svg>`}
function viewCert(id){const c=db.certs.find(x=>x.id==id);$('#modal').innerHTML=`<div class="ov"><div class="md"><div id="certbox">${certSVG(c)}</div><div class="act"><button class="btn" onclick="A.dl('${id}')">⬇ Download Certificate</button><button class="btn o" onclick="window.print()">🖨 Print Certificate</button><button class="btn ghost" onclick="closeM()">Close</button></div></div></div>`}
const A={
apply(pid){if(S?.r!='u'){toast('Please login as a volunteer to apply');location.hash='login';return}
if(db.apps.some(a=>a.uid==S.id&&a.pid==pid))return toast('You have already applied for this program');
db.apps.push({id:'a'+uid(),uid:S.id,pid,st:'pending',hrs:0,date:today()});db.notes.push({id:uid(),to:'admin',msg:`${U(S.id).name} applied for ${Pg(pid).t}.`,date:today()});save();toast('Application submitted! Status: Pending');if(location.hash=='#u-programs'||location.hash=='#u-apps')go()},
async setSt(id,st){const a=db.apps.find(x=>x.id==id);if(st=='rejected'&&!await ask('Reject this application?'))return;a.st=st;if(st=='approved')a.hrs=8;db.notes.push({id:uid(),to:a.uid,msg:`Your application for ${Pg(a.pid).t} was ${st}.`,date:today()});save();toast('Application '+st);go()},
async issue(id){const a=db.apps.find(x=>x.id==id);if(!await ask('Issue certificate to '+U(a.uid).name+'?'))return;const c={id:'ST-2026-'+(1000+db.certs.length+1+Math.floor(Math.random()*90)),uid:a.uid,pid:a.pid,date:today()};db.certs.push(c);db.notes.push({id:uid(),to:a.uid,msg:`Certificate ${c.id} issued for ${Pg(a.pid).t}.`,date:today()});save();toast('Certificate issued');go()},
dl(id){const c=db.certs.find(x=>x.id==id),b=new Blob([certSVG(c).replace('width="100%"','width="1000"')],{type:'image/svg+xml'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=id+'.svg';document.body.append(l);l.click();l.remove();toast('Certificate download started')},

review(){const mine=db.apps.filter(a=>a.uid==S.id&&a.st=='approved'),ok=mine.filter(a=>!db.reviews.some(r=>r.uid==S.id&&r.pid==a.pid));if(!ok.length)return toast(mine.length?'You have already reviewed all your programs':'You can review a program once your application is approved');

function counters(){document.querySelectorAll('[data-n]').forEach(el=>{const n=+el.dataset.n,pre=el.dataset.p||'';let i=0;const t=setInterval(()=>{i+=Math.max(1,n/40);if(i>=n){i=n;clearInterval(t)}el.textContent=pre+Math.round(i).toLocaleString('en-IN')},30)})}
function reveal(){const o=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');o.unobserve(x.target)}}),{threshold:.1});document.querySelectorAll('.fi').forEach(x=>o.observe(x));setTimeout(()=>document.querySelectorAll('.fi').forEach(x=>x.classList.add('in')),1200)}

if(k=='donations')return `<h2>Manage Donations</h2><button class="btn" onclick="A.don()">+ Record Donation</button><br><br>${tbl(['Donor','Amount','Program','Date'],db.donations.map(d=>[e(d.donor),'₹'+d.amt.toLocaleString('en-IN'),e(d.prog),fd(d.date)]))}`;
if(k=='certs'){const el=ap.filter(a=>a.st=='approved'&&!db.certs.some(c=>c.uid==a.uid&&c.pid==a.pid));return `<h2>Manage Certificates</h2><h3>Approved volunteers awaiting certificate</h3>${tbl(['Volunteer','Program',''],el.map(a=>[e(U(a.uid)?.name),e(Pg(a.pid)?.t),`<button class="btn sm o" onclick="A.issue('${a.id}')">Issue Certificate</button>`]))}<h3 style="margin-top:22px">Issued certificates</h3>${tbl(['ID','Volunteer','Program','Date',''],db.certs.map(c=>[c.id,e(U(c.uid)?.name),e(Pg(c.pid)?.t),fd(c.date),`<button class="btn sm" onclick="viewCert('${c.id}')">View</button>`]))}`}
if(k=='feedbacks'){const rv=db.reviews.slice().reverse(),avg=rv.length?(rv.reduce((s,r)=>s+r.rating,0)/rv.length).toFixed(1):'0.0';return `<h2>Volunteer Feedbacks</h2><div class="stats">${stat(rv.length,'Total feedbacks')}<div class="card stat fi"><b>${avg} ★</b><span>Average rating</span></div>${stat(rv.filter(r=>r.rating>=4).length,'Positive (4–5★)')}${stat(rv.filter(r=>r.rating<=2).length,'Needs attention (1–2★)')}</div><br>${tbl(['Volunteer','Program','Rating','Feedback','Date',''],rv.map(r=>[e(U(r.uid)?.name),e(Pg(r.pid)?.t),stars(r.rating),`<span class="wrap">${e(r.msg)}</span>`,fd(r.date),`<button class="btn sm r" onclick="A.del('reviews','${r.id}','Delete this feedback?')">Delete</button>`]))}`}
if(k=='notes')return `<h2>Manage Notifications</h2><button class="btn" onclick="A.note()">+ Send Notification</button><br><br>${tbl(['Date','Audience','Message'],db.notes.slice().reverse().map(n=>[fd(n.date),n.to=='all'?'All volunteers':n.to=='admin'?'Admin':e(U(n.to)?.name),e(n.msg)]))}`}
function go(){const r=location.hash.slice(1)||'home';navbar(r);const app=$('#app');let h='',after=()=>{};window.scrollTo(0,0);
if(/^[ua]-/.test(r)){if(S?.r!=r[0]){toast('Please login first');location.hash=r[0]=='a'?'admin-login':'login';return}
const k=r.slice(2),v=(r[0]=='a'?adminView:userView)(k);if(!v){location.hash=r[0]+'-dashboard';return}h=shell(r,v);
after=()=>{if(k=='profile')$('#pf').onsubmit=ev=>{ev.preventDefault();const v=Object.fromEntries(new FormData(ev.target));if(v.name.trim().length<3)return $('#er').textContent='Name is too short.';if(!/^\d{10}$/.test(v.phone))return $('#er').textContent='Phone must be 10 digits.';Object.assign(U(S.id),v);save();toast('Profile updated');go()}}}
else if(r=='home')h=home();else if(r=='programs')h=programs();else if(r=='about')h=about();else if(r.startsWith('program-'))h=detail(r.slice(8));
else if(r=='login'||r=='register'||r=='admin-login'){h=authPage(r=='admin-login'?'a':'u',r=='register');after=()=>bindAuth(r=='admin-login'?'a':'u',r=='register')}
else h='<div class="w page"><h2>Page not found</h2><a class="btn" href="#home">Go home</a></div>';
app.innerHTML=h;if(r!='home'&&!/^[ua]-/.test(r)&&r!='login'&&r!='register'&&r!='admin-login')app.insertAdjacentHTML('beforeend','');after();reveal();counters()}
addEventListener('hashchange',go);go();
</script>
